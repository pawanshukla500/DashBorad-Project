name: reconcentral

services:
  reconcentral:
    container_name: ReconCentral
    image: reconcentral:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3001
      CLIENT_DIST_PATH: /app/frontend/dist
      PG_SSL: ${PG_SSL:-false}
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      PG_POOL_MIN: ${PG_POOL_MIN:-2}
      PG_POOL_IDLE_TIMEOUT_MS: ${PG_POOL_IDLE_TIMEOUT_MS:-120000}
      PG_POOL_MAX_LIFETIME_SECONDS: ${PG_POOL_MAX_LIFETIME_SECONDS:-900}
      PG_CONNECT_TIMEOUT_MS: ${PG_CONNECT_TIMEOUT_MS:-30000}
      PG_HEALTHCHECK_INTERVAL_MS: ${PG_HEALTHCHECK_INTERVAL_MS:-20000}
      PG_READ_STATEMENT_TIMEOUT_MS: ${PG_READ_STATEMENT_TIMEOUT_MS:-45000}
      PG_APPLICATION_NAME: ${PG_APPLICATION_NAME:-reconcentral-api}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared_infra
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shared_infra"
      - "traefik.http.routers.reconcentral.rule=Host(`payments.youthnic.shop`)"
      - "traefik.http.routers.reconcentral.entrypoints=websecure"
      - "traefik.http.routers.reconcentral.tls=true"
      - "traefik.http.routers.reconcentral.tls.certresolver=letsencrypt"
      - "traefik.http.routers.reconcentral.service=reconcentral"
      - "traefik.http.routers.reconcentral-fallback.rule=Host(`reconcentral.srv1845788.hstgr.cloud`)"
      - "traefik.http.routers.reconcentral-fallback.entrypoints=websecure"
      - "traefik.http.routers.reconcentral-fallback.tls=true"
      - "traefik.http.routers.reconcentral-fallback.tls.certresolver=letsencrypt"
      - "traefik.http.routers.reconcentral-fallback.service=reconcentral"
      - "traefik.http.services.reconcentral.loadbalancer.server.port=3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  shared_infra:
    external: true
