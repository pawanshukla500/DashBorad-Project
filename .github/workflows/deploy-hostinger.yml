name: Test and deploy to Hostinger

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_predeploy_backup:
        description: Deploy without the pre-deploy pg_dump of paymentapp (only if the backup step blocks an urgent fix)
        type: boolean
        default: false
      rollback_drill:
        description: Rollback drill - deploy this commit, then deliberately roll back to the image that was running before
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Run tests & build
    runs-on: ubuntu-latest
    # Superseded PR runs are cancelled; master runs always finish. This group
    # is per ref, so a PR push can never cancel a queued production deploy.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Run backend tests
        run: npm test --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Check deploy script
        run: |
          shellcheck --severity=warning scripts/deploy/*.sh
          bash scripts/deploy/test-hostinger-deploy.sh

  deploy:
    name: Deploy to Hostinger VPS
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Build + pg_dump + health checks take ~10 minutes; a hung step must not
    # hold the production queue for GitHub's 6-hour default.
    timeout-minutes: 45
    # Deploys queue one at a time and are never cancelled mid-flight.
    concurrency:
      group: reconcentral-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          echo "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in {1..5}; do
            ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break || sleep 2
          done

      - name: Prepare bundle and environment
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN || 'payments.youthnic.shop' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RATE_CARD_NOTIFICATION_TO: ${{ secrets.RATE_CARD_NOTIFICATION_TO }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
        run: |
          # 0600 here means scp also creates the VPS copy as 0600.
          umask 077
          # Create production .env file
          cat <<EOF > /tmp/hostinger.env
          NODE_ENV=production
          PORT=3001
          APP_DOMAIN=${APP_DOMAIN}
          CORS_ORIGINS=https://payments.youthnic.shop,https://reconcentral.srv1845788.hstgr.cloud,https://recon.srv1845788.hstgr.cloud
          DATABASE_URL=${DATABASE_URL}
          PG_SSL=false
          PG_POOL_MAX=20
          PG_POOL_MIN=2
          PG_POOL_IDLE_TIMEOUT_MS=120000
          PG_POOL_MAX_LIFETIME_SECONDS=900
          PG_CONNECT_TIMEOUT_MS=30000
          PG_HEALTHCHECK_INTERVAL_MS=20000
          PG_READ_STATEMENT_TIMEOUT_MS=45000
          PG_APPLICATION_NAME=reconcentral-api
          JWT_SECRET=${JWT_SECRET}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          RESEND_API_KEY=${RESEND_API_KEY}
          RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
          RATE_CARD_NOTIFICATION_TO=${RATE_CARD_NOTIFICATION_TO}
          EOF

          # Append single-line JSON secret
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf 'FIREBASE_SERVICE_ACCOUNT_JSON=%s\n' "$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | tr -d '\r\n')" >> /tmp/hostinger.env
          fi

          # Archive repo excluding node_modules and .git into /tmp
          tar --warning=no-file-changed \
              --exclude='./backend/node_modules' \
              --exclude='./frontend/node_modules' \
              --exclude='./.git' \
              --exclude='./.codex-tmp' \
              -czf /tmp/reconcentral-source.tar.gz .

          scp -P "$HOSTINGER_PORT" -i ~/.ssh/id_ed25519 /tmp/hostinger.env "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/reconcentral/hostinger.env"
          scp -P "$HOSTINGER_PORT" -i ~/.ssh/id_ed25519 /tmp/reconcentral-source.tar.gz "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/reconcentral/reconcentral-source.tar.gz"

      - name: Deploy ReconCentral Container
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          # Always the literal string true/false (inputs are empty on push).
          SKIP_PREDEPLOY_BACKUP: ${{ inputs.skip_predeploy_backup == true }}
          ROLLBACK_DRILL: ${{ inputs.rollback_drill == true }}
        run: |
          # Builds reconcentral:$GITHUB_SHA, dumps paymentapp, starts the new
          # container and rolls back to the previous image if it is unhealthy.
          # Only these non-secret values travel on the command line; secrets
          # stay in the .env file uploaded above. If this connection drops,
          # the script keeps running on the VPS and logs to
          # /opt/reconcentral/deploy-logs/.
          ssh -p "$HOSTINGER_PORT" -i ~/.ssh/id_ed25519 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "IMAGE_TAG=${GITHUB_SHA} SKIP_PREDEPLOY_BACKUP=${SKIP_PREDEPLOY_BACKUP} ROLLBACK_DRILL=${ROLLBACK_DRILL} bash -s" \
            < scripts/deploy/hostinger-deploy.sh
