name: Test and deploy to Hostinger

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: reconcentral-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Run tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Run backend tests
        run: npm test --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  deploy:
    name: Deploy to Hostinger VPS
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          echo "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Prepare bundle and environment
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN || 'payments.youthnic.shop' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RATE_CARD_NOTIFICATION_TO: ${{ secrets.RATE_CARD_NOTIFICATION_TO }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
        run: |
          # Create production .env file
          cat <<EOF > /tmp/hostinger.env
          NODE_ENV=production
          PORT=3001
          APP_DOMAIN=${APP_DOMAIN}
          CORS_ORIGINS=https://payments.youthnic.shop,https://reconcentral.srv1845788.hstgr.cloud,https://recon.srv1845788.hstgr.cloud,http://200.141.1.119:3001
          DATABASE_URL=${DATABASE_URL}
          PG_SSL=false
          JWT_SECRET=${JWT_SECRET}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          RESEND_API_KEY=${RESEND_API_KEY}
          RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
          RATE_CARD_NOTIFICATION_TO=${RATE_CARD_NOTIFICATION_TO}
          EOF

          # Append single-line JSON secret
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf 'FIREBASE_SERVICE_ACCOUNT_JSON=%s\n' "$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | tr -d '\r\n')" >> /tmp/hostinger.env
          fi

          # Archive repo excluding node_modules and .git into /tmp
          tar --warning=no-file-changed \
              --exclude='./backend/node_modules' \
              --exclude='./frontend/node_modules' \
              --exclude='./.git' \
              --exclude='./.codex-tmp' \
              -czf /tmp/reconcentral-source.tar.gz .

          scp -P "$HOSTINGER_PORT" -i ~/.ssh/id_ed25519 /tmp/hostinger.env "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/reconcentral/hostinger.env"
          scp -P "$HOSTINGER_PORT" -i ~/.ssh/id_ed25519 /tmp/reconcentral-source.tar.gz "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/reconcentral/reconcentral-source.tar.gz"

      - name: Deploy ReconCentral Container
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
        run: |
          ssh -p "$HOSTINGER_PORT" -i ~/.ssh/id_ed25519 "${HOSTINGER_USER}@${HOSTINGER_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail

          cd /opt/reconcentral
          rm -rf ReconCentral
          mkdir -p ReconCentral
          tar -xzf reconcentral-source.tar.gz -C ReconCentral
          cd ReconCentral
          mv /opt/reconcentral/hostinger.env .env
          chmod 600 .env
          ln -sf docker-compose.production.yml docker-compose.yml

          # Ensure firewall allows container port 3001 for direct hostinger panel access
          ufw allow 3001/tcp || true

          # Remove old legacy collision folder if present
          rm -rf /opt/reconcentral/app

          echo "Deploying ReconCentral container via docker compose with project name reconcentral..."
          docker compose -p reconcentral -f docker-compose.production.yml --env-file .env up -d --build --remove-orphans

          # Symlink to /docker/reconcentral for native Hostinger Docker Manager hPanel detection
          mkdir -p /docker
          ln -sfn /opt/reconcentral/ReconCentral /docker/reconcentral

          echo "Verifying ReconCentral container health..."
          sleep 10
          docker ps --filter "name=ReconCentral"

          # Health check retry loop
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:3001/health; then
              echo ""
              echo "ReconCentral is live and healthy!"
              break
            fi
            echo "Waiting for ReconCentral to report healthy ($i/15)..."
            sleep 5
          done

          docker image prune -f
          EOF
