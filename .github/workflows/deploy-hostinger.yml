name: Test and deploy to Hostinger

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: reconcentral-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Run tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Run backend tests
        run: npm test --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  deploy:
    name: Deploy to Hostinger VPS
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          echo "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in {1..5}; do
            ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break || sleep 2
          done

      - name: Prepare bundle and environment
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN || 'payments.youthnic.shop' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RATE_CARD_NOTIFICATION_TO: ${{ secrets.RATE_CARD_NOTIFICATION_TO }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
        run: |
          # Create production .env file
          cat <<EOF > /tmp/hostinger.env
          NODE_ENV=production
          PORT=3001
          APP_DOMAIN=${APP_DOMAIN}
          CORS_ORIGINS=https://payments.youthnic.shop,https://reconcentral.srv1845788.hstgr.cloud,https://recon.srv1845788.hstgr.cloud
          DATABASE_URL=${DATABASE_URL}
          PG_SSL=false
          PG_POOL_MAX=20
          PG_POOL_MIN=2
          PG_POOL_IDLE_TIMEOUT_MS=55000
          PG_POOL_MAX_LIFETIME_SECONDS=900
          PG_HEALTHCHECK_INTERVAL_MS=25000
          PG_READ_STATEMENT_TIMEOUT_MS=45000
          PG_APPLICATION_NAME=reconcentral-api
          JWT_SECRET=${JWT_SECRET}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          RESEND_API_KEY=${RESEND_API_KEY}
          RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
          RATE_CARD_NOTIFICATION_TO=${RATE_CARD_NOTIFICATION_TO}
          EOF

          # Append single-line JSON secret
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            printf 'FIREBASE_SERVICE_ACCOUNT_JSON=%s\n' "$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | tr -d '\r\n')" >> /tmp/hostinger.env
          fi

          # Archive repo excluding node_modules and .git into /tmp
          tar --warning=no-file-changed \
              --exclude='./backend/node_modules' \
              --exclude='./frontend/node_modules' \
              --exclude='./.git' \
              --exclude='./.codex-tmp' \
              -czf /tmp/reconcentral-source.tar.gz .

          scp -P "$HOSTINGER_PORT" -i ~/.ssh/id_ed25519 /tmp/hostinger.env "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/reconcentral/hostinger.env"
          scp -P "$HOSTINGER_PORT" -i ~/.ssh/id_ed25519 /tmp/reconcentral-source.tar.gz "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/reconcentral/reconcentral-source.tar.gz"

      - name: Deploy ReconCentral Container
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
        run: |
          ssh -p "$HOSTINGER_PORT" -i ~/.ssh/id_ed25519 "${HOSTINGER_USER}@${HOSTINGER_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail

          cd /opt/reconcentral
          rm -rf ReconCentral
          mkdir -p ReconCentral
          tar -xzf reconcentral-source.tar.gz -C ReconCentral
          cd ReconCentral
          mv /opt/reconcentral/hostinger.env .env
          chmod 600 .env
          ln -sf docker-compose.production.yml docker-compose.yml

          # Keep public traffic on Traefik/HTTPS only. The API container is
          # reachable to Traefik through Docker's shared_infra network.
          ufw delete allow 3001/tcp || true

          # Remove old legacy collision folder if present
          rm -rf /opt/reconcentral/app

          echo "Deploying ReconCentral container via docker compose with project name reconcentral..."
          docker compose -p reconcentral -f docker-compose.production.yml --env-file .env up -d --build --remove-orphans

          # Symlink to /docker/reconcentral for native Hostinger Docker Manager hPanel detection
          mkdir -p /docker
          ln -sfn /opt/reconcentral/ReconCentral /docker/reconcentral

          echo "Verifying private database route from inside the app container..."
          docker exec ReconCentral node -e "const dns=require('node:dns').promises; const raw=process.env.DATABASE_URL || ''; const host=new URL(raw).hostname; const privateHost=host==='localhost'||host==='127.0.0.1'||host==='postgres'||host==='host.docker.internal'||host.endsWith('.docker.internal')||/^10\\./.test(host)||/^192\\.168\\./.test(host)||/^172\\.(1[6-9]|2[0-9]|3[0-1])\\./.test(host); if(!privateHost){console.error('DATABASE_URL host is not private for same-VPS deployment'); process.exit(1);} dns.lookup(host).then(({address})=>console.log(JSON.stringify({databaseHost:host,resolved:address}))).catch(error=>{console.error(error.message); process.exit(1);});"

          echo "Verifying ReconCentral container health..."
          sleep 10
          docker ps --filter "name=ReconCentral"

          # Health check retry loop
          healthy=0
          for i in {1..15}; do
            if docker exec ReconCentral node -e "fetch('http://127.0.0.1:3001/health').then(async r=>{const body=await r.json().catch(()=>({})); const database=body.database || {}; if(!r.ok || !body.dbConnected || database.schemaReady !== true || database.transport?.productionReady !== true){console.error(JSON.stringify({status:r.status,dbConnected:body.dbConnected,schemaReady:database.schemaReady,transport:database.transport,pool:database.pool})); process.exit(1);} console.log(JSON.stringify({status:r.status,dbConnected:body.dbConnected,schemaReady:database.schemaReady,transport:database.transport,pool:database.pool}));}).catch(error=>{console.error(error.message); process.exit(1);})"; then
              echo ""
              echo "ReconCentral is live and healthy!"
              healthy=1
              break
            fi
            echo "Waiting for ReconCentral to report healthy ($i/15)..."
            sleep 5
          done

          if [ "$healthy" -ne 1 ]; then
            echo "ReconCentral did not become database-ready in time."
            docker logs ReconCentral --tail=200
            exit 1
          fi

          APP_DOMAIN="$(grep -E '^APP_DOMAIN=' .env | cut -d= -f2- || true)"
          if [ -n "$APP_DOMAIN" ]; then
            public_healthy=0
            for i in {1..6}; do
              if curl -fsS "https://${APP_DOMAIN}/health" >/dev/null; then
                public_healthy=1
                break
              fi
              echo "Waiting for public HTTPS health route ($i/6)..."
              sleep 5
            done
            if [ "$public_healthy" -ne 1 ]; then
              echo "Public HTTPS health route did not become healthy."
              exit 1
            fi
          fi

          docker image prune -f
          EOF
