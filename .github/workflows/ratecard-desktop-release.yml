name: Test installed RateCard desktop packages

on:
  pull_request:
    branches: [master]
  push:
    tags: ['v*.*.*']
    branches: [ratecard_automation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: Real PostgreSQL rate-card migration and publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ratecard_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d ratecard_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix backend
      - run: npm test --prefix backend -- tests/rateCardPostgresIntegration.test.js
        env:
          RATECARD_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/ratecard_fixture
  package:
    name: Install and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix desktop
      - name: Desktop regression tests
        run: npm test --prefix desktop
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Tag does not match desktop/package.json version"
            exit 1
          fi
      - name: Build Windows installer and portable app
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never
      - name: Install and launch actual Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RECON_EXPECT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $installDir = Join-Path $env:RUNNER_TEMP 'ratecard-installed'
          $setup = Join-Path $pwd "released/build/ReconCentral RateCard Worker Setup $version.exe"
          $installer = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$installDir" -WindowStyle Hidden -PassThru
          if (-not $installer.WaitForExit(120000)) { throw 'Installer timeout' }
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $output = Join-Path $pwd 'released/build/windows-smoke.json'
          $app = Start-Process -FilePath (Join-Path $installDir 'ReconCentral RateCard Worker.exe') -ArgumentList "--ratecard-smoke-test=$output" -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(90000)) { throw 'Installed Electron smoke test timeout' }
          if ($app.ExitCode -ne 0) { throw "Installed Electron failed: $($app.ExitCode)" }
          $result = Get-Content $output -Raw | ConvertFrom-Json
          if (-not $result.success -or $result.commit -ne $env:RECON_EXPECT_COMMIT) { throw ($result | ConvertTo-Json -Depth 8) }
      - name: Install Linux build/runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libfuse2
      - name: Build Linux AppImage and Debian package
        if: runner.os == 'Linux'
        working-directory: desktop
        run: npx electron-builder --linux AppImage deb --publish never
      - name: Install and launch actual Linux package
        if: runner.os == 'Linux'
        env:
          RECON_EXPECT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          sudo dpkg -i released/build/*.deb
          PACKAGE=$(dpkg-deb -f released/build/*.deb Package)
          EXECUTABLE=$(dpkg -L "$PACKAGE" | sed -n '\#/reconcentral-ratecard-worker$#p')
          test -n "$EXECUTABLE"
          timeout 90s xvfb-run -a "$EXECUTABLE" --no-sandbox --ratecard-smoke-test="$PWD/released/build/linux-smoke.json"
          node -e "const r=require('./released/build/linux-smoke.json'); if(!r.success || r.commit!==process.env.RECON_EXPECT_COMMIT) throw Error(JSON.stringify(r));"
      - name: Upload packages and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ratecard-desktop-${{ runner.os }}
          path: |
            released/build/*.exe
            released/build/*.blockmap
            released/build/*.yml
            released/build/*.deb
            released/build/*.AppImage
            released/build/*-smoke.json
            released/build/*-smoke.json.png
          if-no-files-found: warn

  publish:
    name: Publish tested release assets (tags only)
    needs: [package, postgres]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ratecard-desktop-*
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/*.yml
            artifacts/*.deb
            artifacts/*.AppImage
