name: Build & Release RateCard Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - ratecard_automation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package.json

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install

      - name: Build for Windows
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for Linux
        if: runner.os == 'Linux'
        working-directory: desktop
        run: npx electron-builder --linux AppImage deb --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ratecard-desktop-${{ runner.os }}
          path: |
            desktop/dist-release/*.exe
            desktop/dist-release/*.AppImage
            desktop/dist-release/*.deb

      - name: Create GitHub Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist-release/*.exe
            desktop/dist-release/*.AppImage
            desktop/dist-release/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
