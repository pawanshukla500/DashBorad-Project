name: Build & Release RateCard Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - ratecard_automation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installers & publish the GitHub release (tags)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm ci

      # On a v*.*.* tag push this publishes a live GitHub Release: the NSIS
      # installer, the portable exe, their .blockmap files, and latest.yml —
      # the feed electron-updater's auto-update in the installed app reads.
      # Non-tag runs (branch pushes, manual dispatch) stay artifact-only.
      - name: Build for Windows
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish "$env:PUBLISH_MODE"
        env:
          PUBLISH_MODE: ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ratecard-desktop-Windows
          path: |
            desktop/dist-release/*.exe
            desktop/dist-release/*.exe.blockmap
            desktop/dist-release/latest.yml
          if-no-files-found: error

  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm ci

      - name: Build for Linux
        working-directory: desktop
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ratecard-desktop-Linux
          path: |
            desktop/dist-release/*.AppImage
            desktop/dist-release/*.deb
          if-no-files-found: error

  attach-linux-release-assets:
    name: Attach Linux packages to the GitHub release
    # The Windows job creates the release (installer + latest.yml). Only after
    # both build jobs succeed do the Linux packages join it — attaching to a
    # release that was never created would publish an auto-update feed with no
    # installer in it.
    if: >-
      startsWith(github.ref, 'refs/tags/') &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success'
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ratecard-desktop-*
          merge-multiple: true
          path: artifacts

      - name: Attach AppImage & deb to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.AppImage
            artifacts/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
